[project]
name = "2609-cwa-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.53",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.53.0",
]

[project.scripts]
2609-cwa-crawler = "2609_cwa_crawler:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
